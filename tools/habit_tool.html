    <h1>習慣化アプリ</h1>
    <h2>連続継続日数・合計継続日数を表示し、達成時に上にフォームが出て回数を入力できます。</h2>
</div>

<button id="addHabit">
   新しい習慣を追加
</button>

<div id="habitModal">

    <div class="modal-content">

        <h2>新しい習慣を追加</h2>

        <label>習慣名</label>
        <input id="habitName">

        <label>目標</label>
        <input id="habitGoal">

        <label>記録方法</label>

        <select id="habitType">
            <option value="check">達成・未達成</option>
            <option value="count">回数</option>
            <option value="time">時間</option>
        </select>

        <div id="unitArea">

          <label>単位</label>

          <input
             id="habitUnit"
             placeholder="例：回、分、ページ、km">

        </div>

        <br></br>

        <button id="saveHabit">
            保存
        </button>

        <button id="closeModal">
            閉じる
        </button>

    </div>

</div>

<!-- 詳細モーダル -->
<div id="detailModal">
    <div class="modal-content">
        <div id="detailBody"></div>
        <button id="closeDetail">閉じる</button>
    </div>
</div>

<div id="habitList">
