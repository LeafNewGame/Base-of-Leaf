<h1>習慣化アプリ</h1>




<button id="addHabit">
   新しい習慣を追加
</button>


<div id="habitModal">

    <div class="modal-content">

        <h2>新しい習慣を追加</h2>

        <label>習慣名</label>
        <input id="habitName">

        <br></br>

        <label>目標</label>
        <input id="habitGoal">

        <br></br>

        <label>記録方法</label>

        <select id="habitType">
            <option value="check">達成・未達成</option>
            <option value="count">回数</option>
            <option value="time">時間</option>
        </select>

        <div id="unitArea">

          <label>単位</label>

          <input
             id="habitUnit"
             placeholder="例：回、分、ページ、km">

        </div>

        <br></br>

        <button id="saveHabit">
            保存
        </button>

        <button id="closeModal">
            閉じる
        </button>

    </div>

</div>

<div id="recordModal">

    <div class="modal-content">

        <h2>今回の記録(製作中)</h2>

        <input
            id="recordValue"
            type="number"
            placeholder="数値を入力してください">

        <br><br>

        <button id="saveRecord">
            保存
        </button>

        <button id="closeRecord">
            閉じる
        </button>

    </div>

</div>

<div id="habitList">

</div>
